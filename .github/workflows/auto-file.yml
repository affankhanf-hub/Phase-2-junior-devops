name: Auto File Creator

on:
  push:
    branches: [ main ]

jobs:
  create-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create a file automatically
        run: echo "Hello from GitHub Actions" > auto-file.txt

      - name: Commit and push the file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add auto-file.txt
          git commit -m "auto: add auto-file.txt" || echo "No changes to commit"
          git push
