version: '3.8'

services:
  web:
    build: .
    container_name: shopeasy-web
    ports:
      - "8080:80"
    depends_on:
      - db
      - cache

  db:
    image: mysql:8.0
    container_name: shopeasy-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: shopeasy
    volumes:
      - db_data:/var/lib/mysql

  cache:
    image: redis:alpine
    container_name: shopeasy-cache

volumes:
  db_data:
